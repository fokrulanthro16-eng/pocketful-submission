version: "3.8"

services:
  pocketful-ledger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pocketful-enterprise-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, json; res = json.loads(urllib.request.urlopen('http://127.0.0.1:8080/health').read()); exit(0 if res.get('status') == 'ok' else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
